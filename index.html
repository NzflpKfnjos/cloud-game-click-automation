<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>金铲铲自动对战</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #0d1520;
        --surface: #152232;
        --surface-raised: #1b2b3f;
        --border: #31475e;
        --text: #eaf2fb;
        --muted: #91a6bc;
        --accent: #54b6ff;
        --accent-strong: #258bd3;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        background: #111c2a;
      }

      .app-picker {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        white-space: nowrap;
      }

      .app-picker label { font-size: 12px; }

      .app-picker select {
        min-height: 34px;
        padding: 6px 30px 6px 9px;
        border: 1px solid #49647e;
        border-radius: 5px;
        background: #22364c;
        color: var(--text);
        font: inherit;
      }

      .title-group { min-width: 0; }

      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .subtitle a {
        color: var(--accent);
        text-decoration: none;
      }

      .subtitle a:hover,
      .subtitle a:focus-visible {
        text-decoration: underline;
      }

      button {
        min-height: 34px;
        padding: 7px 12px;
        border: 1px solid #49647e;
        border-radius: 5px;
        background: #22364c;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      main {
        display: flex;
        width: min(1800px, 100%);
        flex: 1;
        margin: 0 auto;
        padding: 18px;
      }

      .window-grid {
        display: grid;
        width: 100%;
        min-height: 0;
        align-items: center;
        justify-items: center;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        gap: 14px;
      }

      .game-window {
        display: flex;
        width: min(100%, 1600px, calc(177.78vh - 266.67px));
        min-width: 0;
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface);
        box-shadow: 0 7px 24px #0000002b;
      }

      .window-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 42px;
        padding: 7px 10px 7px 13px;
        background: var(--surface-raised);
      }

      .window-label {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }

      .window-dot {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px #54b6ff1c;
      }

      .window-state {
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .window-actions { display: flex; flex: 0 0 auto; gap: 6px; }
      .window-actions button { min-height: 28px; padding: 4px 9px; font-size: 12px; }

      iframe {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        min-height: 0;
        flex: 0 1 auto;
        border: 0;
        background: #080d14;
      }

      @media (max-width: 760px) {
        .topbar { align-items: flex-start; flex-direction: column; padding: 15px; }
        main { padding: 12px; }
        .window-grid { grid-template-columns: 1fr; grid-template-rows: minmax(360px, 1fr); }
        .game-window { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="title-group">
          <h1>金铲铲自动对战</h1>
          <p class="subtitle">
            <a href="https://www.tampermonkey.net/" target="_blank" rel="noopener noreferrer">Tampermonkey 官网</a>
            <span aria-hidden="true"> · </span>
            <a href="https://jcc.5678989.eu.org/cloud-game-click-automation.user.js" target="_blank" rel="noopener noreferrer">自动化脚本</a>
            <span aria-hidden="true"> · </span>
            <a href="chrome://extensions/" target="_blank" rel="noopener noreferrer">Chrome 扩展管理</a>
            <span aria-hidden="true"> · </span>
            <a href="edge://extensions/" target="_blank" rel="noopener noreferrer">Edge 扩展管理</a>
          </p>
        </div>
        <div class="app-picker">
          <button type="button" data-action="toggle-diagnostics">开始记录日志</button>
          <span data-role="diagnostic-status" aria-live="polite">故障日志自动保留</span>
          <button type="button" data-action="export-diagnostics">导出诊断日志</button>
          <label for="app-select">应用</label>
          <select id="app-select" aria-label="选择应用">
            <option value="jcc">金铲铲自动对战</option>
            <option value="naruto">火影忍者</option>
          </select>
        </div>
      </header>

      <main>
        <section class="window-grid" aria-label="金铲铲自动对战">
          <article class="game-window" data-window="1">
            <div class="window-bar">
              <div class="window-label"><span class="window-dot"></span><span data-role="window-title">金铲铲自动对战</span><span class="window-state">加载中...</span></div>
              <div class="window-actions">
                <button type="button" data-action="reconnect">重新连接</button>
              </div>
            </div>
            <iframe title="金铲铲自动对战" loading="eager" allow="autoplay; fullscreen; clipboard-read; clipboard-write"></iframe>
          </article>
        </section>
      </main>
    </div>

    <script>
      const APPS = {
        jcc: {
          name: '金铲铲自动对战',
          url: 'https://start.qq.com/game/arm-game/?ADTAG=10000000&extra=eyJob21lIjoiaHR0cHM6Ly9zdGFydC5xcS5jb20vd2ViZ2FtZS9wcmUtcGxheWluZy83MDA5Njc/ZnJvbVBhZ2U9Z2FtZV9kZXRhaWxfcGFnZSZBRFRBRz0xMDAwMDAwMCIsInN0YXJ0VmVyc2lvbiI6IjAuMTAuOTQwLjUwMDYwMDIiLCJ3ZWJjZ19jb21tb24iOjF9#/game/700967?time=1790047923464',
        },
        naruto: {
          name: '火影忍者',
          url: 'https://start.qq.com/game/arm-game/?ADTAG=10000000&extra=eyJob21lIjoiaHR0cHM6Ly9zdGFydC5xcS5jb20vd2ViZ2FtZS9wcmUtcGxheWluZy83MDA3MjQ/ZnJvbVBhZ2U9Z2FtZV9kZXRhaWxfcGFnZSZBRFRBRz0xMDAwMDAwMCIsInN0YXJ0VmVyc2lvbiI6IjAuMTAuOTAwLjUwMDYwMDIiLCJ3ZWJjZ19jb21tb24iOjF9#/game/700724?time=1790742724938',
        },
      };

      const appSelect = document.querySelector('#app-select');
      const windowGrid = document.querySelector('.window-grid');
      const windows = [...document.querySelectorAll('.game-window')];
      let currentAppKey = appSelect.value;
      let currentApp = APPS[appSelect.value];

      // 持久化诊断日志：刷新后仍保留，用于分析长时间运行后的卡顿。
      const DIAGNOSTIC_KEY = 'cloud-game-click-diagnostics-v1';
      const DIAGNOSTIC_LIMIT = 2000;
      const IMPORTANT_DIAGNOSTIC_KEY = 'cloud-game-click-incidents-v1';
      const IMPORTANT_DIAGNOSTIC_LIMIT = 200;
      const SCRIPT_VERSION = '1.7.1';
      const diagnosticSession = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      let importantSequence = 0;
      function safeDiagnosticData(value, depth = 0, seen = new WeakSet()) {
        if (depth > 7) return '[truncated]';
        if (value == null || typeof value === 'boolean') return value;
        if (typeof value === 'number') return Number.isFinite(value) ? value : String(value);
        if (typeof value === 'string') return value.slice(0, 4000).replace(/https?:\/\/[^\s"'<>]+/g, (text) => {
          try { const url = new URL(text); return `${url.origin}${url.pathname}`; } catch (_) { return '[url]'; }
        }).replace(/\bBearer\s+[a-z0-9._~+\/-]+=*/gi, 'Bearer [redacted]')
          .replace(/\b(access[_-]?token|refresh[_-]?token|password|cookie|credential|secret|authorization)\s*[:=]\s*[^\s,;]+/gi, '$1=[redacted]');
        if (value instanceof Error || (typeof value === 'object' && typeof value.message === 'string' && typeof value.name === 'string')) {
          return { name: safeDiagnosticData(value.name, depth + 1, seen),
            message: safeDiagnosticData(value.message, depth + 1, seen),
            stack: safeDiagnosticData(value.stack, depth + 1, seen) };
        }
        if (typeof value !== 'object') return String(value).slice(0, 4000);
        if (seen.has(value)) return '[circular]';
        seen.add(value);
        if (Array.isArray(value)) return value.slice(0, 50).map((item) => safeDiagnosticData(item, depth + 1, seen));
        const result = {};
        for (const [key, item] of Object.entries(value).slice(0, 50)) {
          result[key] = /token|password|auth|cookie|credential|secret|sdp/i.test(key)
            ? '[redacted]' : safeDiagnosticData(item, depth + 1, seen);
        }
        return result;
      }
      function diagnosticValue(value) {
        if (value === undefined) return null;
        try { return safeDiagnosticData(value); } catch (_) { return '[unavailable]'; }
      }
      function readDiagnostics() {
        try {
          const value = JSON.parse(localStorage.getItem(DIAGNOSTIC_KEY) || '[]');
          return Array.isArray(value) ? value : [];
        } catch (_) { return []; }
      }
      let importantDiagnostics = [];
      try {
        const value = JSON.parse(localStorage.getItem(IMPORTANT_DIAGNOSTIC_KEY) || '[]');
        if (Array.isArray(value)) importantDiagnostics = value.filter((record) => record && typeof record === 'object').slice(-IMPORTANT_DIAGNOSTIC_LIMIT);
      } catch (_) { /* 存储不可用时仍在内存中保存故障记录。 */ }
      function readImportantDiagnostics() {
        try {
          const saved = JSON.parse(localStorage.getItem(IMPORTANT_DIAGNOSTIC_KEY) || '[]');
          if (Array.isArray(saved)) {
            const merged = new Map();
            for (const record of [...saved, ...importantDiagnostics]) {
              if (record && typeof record === 'object') merged.set(`${record.source}:${record.id}`, record);
            }
            importantDiagnostics = [...merged.values()].sort((left, right) =>
              (Date.parse(left.ts) || 0) - (Date.parse(right.ts) || 0)).slice(-IMPORTANT_DIAGNOSTIC_LIMIT);
          }
        } catch (_) {}
        return importantDiagnostics.slice();
      }
      function keepImportantDiagnostic(entry) {
        readImportantDiagnostics();
        if (importantDiagnostics.some((record) => record.id === entry.id && record.source === entry.source)) return null;
        importantDiagnostics.push(entry);
        importantDiagnostics = importantDiagnostics.slice(-IMPORTANT_DIAGNOSTIC_LIMIT);
        try { localStorage.setItem(IMPORTANT_DIAGNOSTIC_KEY, JSON.stringify(importantDiagnostics)); } catch (_) {}
        return entry;
      }
      function logImportantDiagnostic(event, data = {}) {
        return keepImportantDiagnostic({
          id: `${diagnosticSession}-page-${++importantSequence}`,
          ts: new Date().toISOString(), mono: typeof performance !== 'undefined' ? Math.round(performance.now()) : null,
          source: 'page', scriptVersion: SCRIPT_VERSION, session: diagnosticSession, appKey: currentAppKey,
          event, data: diagnosticValue({ visibility: document.visibilityState, online: navigator.onLine, ...data }),
        });
      }
      const DIAGNOSTIC_ENABLED_KEY = 'cloud-game-click-diagnostics-enabled-v1';
      let diagnosticsEnabled = false;
      try { diagnosticsEnabled = localStorage.getItem(DIAGNOSTIC_ENABLED_KEY) === 'true'; } catch (_) {}
      function syncDiagnosticsToFrames() {
        windows.forEach((item) => item.querySelector('iframe').contentWindow?.postMessage?.({ type: 'cgca-diagnostic-control-v1', recording: diagnosticsEnabled }, 'https://start.qq.com'));
      }
      function updateDiagnosticControls() {
        const button = document.querySelector('[data-action="toggle-diagnostics"]');
        const status = document.querySelector('[data-role="diagnostic-status"]');
        if (button) button.textContent = diagnosticsEnabled ? '停止记录日志' : '开始记录日志';
        if (status) { status.textContent = diagnosticsEnabled ? '● 详细日志记录中 · 故障自动保留' : '故障日志自动保留'; status.setAttribute('style', diagnosticsEnabled ? 'color:#7cf0a0' : 'color:#91a6bc'); }
      }
      function setDiagnosticsEnabled(enabled) {
        if (diagnosticsEnabled && !enabled) logDiagnostic('recording-stopped');
        diagnosticsEnabled = enabled;
        try { localStorage.setItem(DIAGNOSTIC_ENABLED_KEY, String(enabled)); } catch (_) {}
        if (enabled) logDiagnostic('recording-started');
        updateDiagnosticControls();
        syncDiagnosticsToFrames();
      }
      const diagnosticCounters = Object.create(null);
      function logDiagnostic(event, data = {}) {
        if (!diagnosticsEnabled) return null;
        diagnosticCounters[event] = (diagnosticCounters[event] || 0) + 1;
        if (event === 'iframe-message' && data.event === 'heartbeat' && diagnosticCounters[event] % 60 !== 1) return null;
        const entry = { ts: new Date().toISOString(), mono: typeof performance !== 'undefined' ? Math.round(performance.now()) : null,
          session: diagnosticSession, event, data: diagnosticValue(data) };
        try {
          const records = readDiagnostics();
          records.push(entry);
          localStorage.setItem(DIAGNOSTIC_KEY, JSON.stringify(records.slice(-DIAGNOSTIC_LIMIT)));
        } catch (_) { /* 存储配额或隐私模式不可用时仍保留控制台日志。 */ }
        try { console.debug('[CGCA]', entry); } catch (_) { /* 控制台不可用不影响页面。 */ }
        return entry;
      }
      function exportDiagnostics() {
        const payload = JSON.stringify({ version: 2, exportedAt: new Date().toISOString(), source: 'page',
          scriptVersion: SCRIPT_VERSION, session: diagnosticSession, recording: diagnosticsEnabled,
          retention: { records: DIAGNOSTIC_LIMIT, importantRecords: IMPORTANT_DIAGNOSTIC_LIMIT, importantAlwaysOn: true },
          environment: { userAgent: navigator.userAgent || null, platform: navigator.platform || null,
            visibility: document.visibilityState, online: navigator.onLine },
          streams: windows.map((item) => { const state = streamStates.get(item); return {
            appKey: currentAppKey, generation: state.generation, iframeSession: state.session,
            loaded: state.loaded, status: state.lastHealthStatus, recoveryAttempts: state.recoveryTimes.length,
            lastHealthAt: state.lastHealthAt, lastHealthAgeMs: state.lastHealthAt === null ? null : Math.max(0, Date.now() - state.lastHealthAt),
            pendingRecovery: state.pendingRecovery, currentEvidence: state.lastEvidence,
          }; }), records: readDiagnostics().map((record) => diagnosticValue(record)),
          importantRecords: readImportantDiagnostics().map((record) => diagnosticValue(record)) }, null, 2);
        try {
          const blob = new Blob([payload], { type: 'application/json' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `cloud-game-diagnostics-${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
          link.click();
          setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        } catch (_) { try { navigator.clipboard?.writeText(payload); } catch (__) { /* 忽略导出失败。 */ } }
        logDiagnostic('diagnostics-exported', { count: readDiagnostics().length });
      }
      window.__CGCA_DIAGNOSTICS = { log: logDiagnostic, read: readDiagnostics,
        logImportant: logImportantDiagnostic, readImportant: readImportantDiagnostics, export: exportDiagnostics };
      logDiagnostic('page-start', { href: window.location?.href || null, visibility: document.visibilityState, online: navigator.onLine });

      function createFrameUrl(generation) {
        const url = new URL(currentApp.url);
        url.searchParams.set('_reconnect', `${Date.now()}-${Math.random().toString(36).slice(2)}`);
        url.searchParams.set('_cgca_generation', generation);
        return url.toString();
      }

      // 每次 iframe 导航重新握手，避免沿用 WindowProxy 的旧消息触发重连。
      const STREAM_RECOVERY_LIMIT = 3;
      const STREAM_RECOVERY_WINDOW_MS = 10 * 60 * 1000;
      const STREAM_RECOVERY_COOLDOWN_MS = 60 * 1000;
      const streamStates = new Map(windows.map((item) => [item, {
        generation: null, session: null, loaded: false, recoveryTimes: [], lastRecovery: -Infinity,
        lastHealthStatus: null, lastHealthLogAt: -Infinity, lastHealthAt: null, lastEvidence: null,
        lastDeferredDecision: null, pendingRecovery: null,
      }]));
      function resetStreamRecovery(gameWindow) {
        const state = streamStates.get(gameWindow);
        state.recoveryTimes = [];
        state.lastRecovery = -Infinity;
        state.lastDeferredDecision = null;
      }
      function sendStreamControl(gameWindow) {
        const state = streamStates.get(gameWindow);
        if (!state.loaded || !state.generation) return;
        gameWindow.querySelector('iframe').contentWindow?.postMessage?.({
          type: 'cgca-stream-control-v1', generation: state.generation, appKey: currentAppKey,
        }, 'https://start.qq.com');
      }
      function handleStreamHealth(gameWindow, data) {
        const state = streamStates.get(gameWindow);
        const statuses = ['healthy', 'suspect', 'recovering', 'unobserved', 'suspended'];
        if (!state.loaded || data.generation !== state.generation || data.appKey !== currentAppKey
          || typeof data.session !== 'string' || !data.session || data.session.length > 200
          || !statuses.includes(data.status) || typeof data.requestRecovery !== 'boolean'
          || (data.reason !== null && (typeof data.reason !== 'string' || data.reason.length > 200))) return;
        if (!state.session) {
          // 先接受正常遥测建立关联，拒绝把第一次消息直接当作刷新请求。
          if (data.requestRecovery) return;
          state.session = data.session;
        }
        if (data.session !== state.session) return;
        const label = gameWindow.querySelector('.window-state');
        const labels = {
          healthy: '画面正常', suspect: '画面疑似停滞，正在检测...', recovering: '正在尝试恢复画面...',
          unobserved: '已加载，等待视频帧', suspended: '画面监测已暂停',
        };
        label.textContent = labels[data.status];
        const now = Date.now();
        state.lastHealthAt = now;
        state.lastEvidence = diagnosticValue(data.evidence);
        if (data.status === 'healthy' && state.pendingRecovery) {
          const pending = state.pendingRecovery;
          logImportantDiagnostic('host-recovery-outcome', {
            previousGeneration: pending.generation, previousSession: pending.session,
            newGeneration: state.generation, newSession: state.session,
            recoveryDurationMs: Math.max(0, now - pending.startedAt), attempt: pending.attempt,
            result: 'frames-resumed', evidence: data.evidence, appKey: pending.appKey, sourceIncidentId: pending.sourceIncidentId,
          });
          state.pendingRecovery = null;
        }
        if (state.lastHealthStatus !== data.status || now - state.lastHealthLogAt >= 30000) {
          logDiagnostic('stream-health', { appKey: data.appKey, generation: state.generation, session: data.session,
            status: data.status, reason: data.reason, evidence: data.evidence, requestRecovery: data.requestRecovery });
          state.lastHealthStatus = data.status;
          state.lastHealthLogAt = now;
        }
        if (!data.requestRecovery) return;
        // 只刷新已经持续停帧且经过软恢复等待的连接；断网/后台不消耗预算。
        const evidence = data.evidence;
        if (data.status !== 'recovering' || !data.reason || !evidence || typeof evidence !== 'object'
          || !Number.isFinite(evidence.staleForMs) || evidence.staleForMs < 30000
          || !Number.isFinite(evidence.softRecoveryWaitMs) || evidence.softRecoveryWaitMs < 10000) return;
        state.recoveryTimes = state.recoveryTimes.filter((at) => now - at < STREAM_RECOVERY_WINDOW_MS);
        const decision = (deferReason = null) => {
          if (deferReason) {
            const signature = `${state.generation}:${state.session}:${deferReason}`;
            if (state.lastDeferredDecision?.signature === signature && now - state.lastDeferredDecision.at < 30000) return;
            state.lastDeferredDecision = { signature, at: now };
          } else state.lastDeferredDecision = null;
          logImportantDiagnostic('host-recovery-decision', {
            generation: state.generation, iframeSession: state.session, reason: data.reason, evidence,
            attempt: state.recoveryTimes.length + 1, decision: deferReason ? 'defer' : 'reconnect', deferReason,
            cooldownRemainingMs: Math.max(0, STREAM_RECOVERY_COOLDOWN_MS - (now - state.lastRecovery)),
            retryLimit: STREAM_RECOVERY_LIMIT, retryWindowMs: STREAM_RECOVERY_WINDOW_MS,
            sourceIncidentId: typeof data.incidentId === 'string' ? data.incidentId.slice(0, 200) : null,
          });
        };
        if (document.hidden || navigator.onLine === false) {
          label.textContent = document.hidden ? '后台已暂停画面恢复' : '网络离线，等待恢复';
          decision(document.hidden ? 'hidden' : 'offline');
          logDiagnostic('stream-recovery-deferred', { reason: document.hidden ? 'hidden' : 'offline' });
          return;
        }
        if (state.recoveryTimes.length >= STREAM_RECOVERY_LIMIT) {
          label.textContent = '画面仍停滞，请手动重新连接';
          decision('retry-limit');
          logDiagnostic('stream-recovery-deferred', { reason: 'retry-limit', attempts: state.recoveryTimes.length });
          return;
        }
        if (now - state.lastRecovery < STREAM_RECOVERY_COOLDOWN_MS) {
          label.textContent = '画面仍停滞，等待重连冷却';
          decision('cooldown');
          logDiagnostic('stream-recovery-deferred', { reason: 'cooldown' });
          return;
        }
        decision();
        if (state.pendingRecovery) {
          const pending = state.pendingRecovery;
          logImportantDiagnostic('host-recovery-outcome', {
            previousGeneration: pending.generation, previousSession: pending.session,
            newGeneration: state.generation, newSession: state.session,
            recoveryDurationMs: Math.max(0, now - pending.startedAt), attempt: pending.attempt,
            result: 'stalled-again', reason: data.reason, evidence, appKey: pending.appKey, sourceIncidentId: pending.sourceIncidentId,
          });
        }
        state.recoveryTimes.push(now);
        state.lastRecovery = now;
        state.pendingRecovery = { generation: state.generation, session: state.session,
          startedAt: now, attempt: state.recoveryTimes.length, appKey: currentAppKey,
          sourceIncidentId: typeof data.incidentId === 'string' ? data.incidentId.slice(0, 200) : null };
        logDiagnostic('stream-recovery-reconnect', { reason: data.reason, evidence, attempt: state.recoveryTimes.length });
        loadFrame(gameWindow, 'stream-recovery');
      }

      function loadFrame(gameWindow, reason = 'initial') {
        const frame = gameWindow.querySelector('iframe');
        const streamState = streamStates.get(gameWindow);
        const previousGeneration = streamState.generation;
        const previousSession = streamState.session;
        if (reason !== 'stream-recovery' && streamState.pendingRecovery) {
          const pending = streamState.pendingRecovery;
          logImportantDiagnostic('host-recovery-outcome', {
            previousGeneration: pending.generation, previousSession: pending.session,
            newGeneration: previousGeneration, newSession: previousSession,
            recoveryDurationMs: Math.max(0, Date.now() - pending.startedAt), attempt: pending.attempt,
            result: 'superseded', reason, appKey: pending.appKey, sourceIncidentId: pending.sourceIncidentId,
          });
          streamState.pendingRecovery = null;
        }
        streamState.loaded = false;
        streamState.generation = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        streamState.session = null;
        streamState.lastHealthStatus = null;
        streamState.lastHealthLogAt = -Infinity;
        streamState.lastHealthAt = null;
        streamState.lastEvidence = null;
        streamState.lastDeferredDecision = null;
        logImportantDiagnostic('host-frame-navigation', {
          reason, generation: streamState.generation, iframeSession: null, previousGeneration, previousSession,
        });
        logDiagnostic('iframe-load-request', { reason, previousSrc: frame.src || null });
        gameWindow.querySelector('.window-state').textContent = reason === 'initial'
          ? '加载中...'
          : '正在重新连接...';
        frame.src = createFrameUrl(streamState.generation);
      }

      function reconnect() {
        logDiagnostic('manual-reconnect', { windows: windows.length });
        windows.forEach((gameWindow) => {
          resetStreamRecovery(gameWindow);
          loadFrame(gameWindow, 'reconnect');
        });
      }

      function selectApp(appKey) {
        const app = APPS[appKey];
        if (!app || app === currentApp) return;
        currentAppKey = appKey;
        currentApp = app;
        document.title = app.name;
        document.querySelector('h1').textContent = app.name;
        windowGrid.setAttribute('aria-label', app.name);
        windows.forEach((gameWindow) => {
          gameWindow.querySelector('[data-role="window-title"]').textContent = app.name;
          gameWindow.querySelector('iframe').title = app.name;
          resetStreamRecovery(gameWindow);
          loadFrame(gameWindow);
        });
      }

      function manualReconnect() {
        reconnect();
      }

      appSelect.addEventListener('change', () => { logDiagnostic('app-change', { appKey: appSelect.value }); selectApp(appSelect.value); });
      document.querySelector('[data-action="reconnect"]').addEventListener('click', manualReconnect);
      document.querySelector('[data-action="export-diagnostics"]')?.addEventListener('click', exportDiagnostics);
      document.querySelector('[data-action="toggle-diagnostics"]')?.addEventListener('click', () => setDiagnosticsEnabled(!diagnosticsEnabled));
      updateDiagnosticControls();
      function logPageIncident(event, data = {}) {
        const states = windows.map((item) => { const state = streamStates.get(item); return {
          generation: state.generation, iframeSession: state.session, loaded: state.loaded,
        }; });
        logImportantDiagnostic(event, { ...data, streams: states });
        logDiagnostic(event, data);
      }
      window.addEventListener('error', (event) => logPageIncident('window-error', { message: event.message, filename: event.filename, line: event.lineno, column: event.colno, error: event.error }));
      window.addEventListener('unhandledrejection', (event) => logPageIncident('unhandled-rejection', { reason: event.reason }));
      window.addEventListener('offline', () => logPageIncident('network-offline'));
      window.addEventListener('online', () => logPageIncident('network-online'));
      document.addEventListener('visibilitychange', () => logPageIncident('visibility-change', { visibility: document.visibilityState }));
      window.addEventListener('pagehide', () => logPageIncident('page-hide'));
      window.addEventListener('pageshow', (event) => logPageIncident('page-show', { persisted: event.persisted }));
      window.addEventListener('message', (event) => {
        if (event.origin !== 'https://start.qq.com') return;
        const gameWindow = windows.find((item) => item.querySelector('iframe').contentWindow === event.source);
        if (!gameWindow) return;
        if (event.data?.type === 'cgca-stream-ready-v1') {
          const state = streamStates.get(gameWindow);
          if (event.data.appKey === currentAppKey
            && (!event.data.generation || event.data.generation === state.generation)) sendStreamControl(gameWindow);
          return;
        }
        if (event.data?.type === 'cgca-stream-health-v1') {
          handleStreamHealth(gameWindow, event.data);
          return;
        }
        if (event.data?.type === 'cgca-incident-v1') {
          const record = event.data.record;
          const state = streamStates.get(gameWindow);
          if (!record || typeof record !== 'object' || Array.isArray(record)
            || record.source !== 'userscript' || record.appKey !== currentAppKey
            || typeof record.id !== 'string' || !record.id || record.id.length > 200
            || typeof record.ts !== 'string' || record.ts.length > 100 || !Number.isFinite(Date.parse(record.ts))
            || (record.mono !== null && (!Number.isFinite(record.mono) || record.mono < 0))
            || typeof record.session !== 'string' || !record.session || record.session.length > 200
            || typeof record.scriptVersion !== 'string' || !record.scriptVersion || record.scriptVersion.length > 50
            || typeof record.event !== 'string' || !record.event || record.event.length > 200
            || !record.data || typeof record.data !== 'object' || Array.isArray(record.data)
            || !state.generation || record.data.generation !== state.generation
            || (state.session && record.session !== state.session)) return;
          // 保留源时钟/会话/记录 ID，让 iframe 重建前后的证据仍可以关联。
          keepImportantDiagnostic({
            id: record.id, ts: record.ts, mono: record.mono, source: record.source,
            scriptVersion: record.scriptVersion, session: record.session, appKey: record.appKey,
            event: record.event, data: diagnosticValue(record.data),
          });
          return;
        }
        if (event.data?.type === 'cgca-diagnostic-status-v1') {
          if (typeof event.data.recording === 'boolean' && diagnosticsEnabled !== event.data.recording) { diagnosticsEnabled = event.data.recording; try { localStorage.setItem(DIAGNOSTIC_ENABLED_KEY, String(diagnosticsEnabled)); } catch (_) {} updateDiagnosticControls(); }
          return;
        }
        if (event.data?.type !== 'cgca-diagnostic-v1') return;
        logDiagnostic('iframe-message', { origin: event.origin, type: event.data?.type || null, event: event.data?.event || null, connectionState: event.data?.connectionState || null, diagnostics: event.data?.diagnostics || null });
      });
      if (typeof PerformanceObserver !== 'undefined') {
        try {
          new PerformanceObserver((list) => list.getEntries().forEach((entry) => {
            const data = { duration: Math.round(entry.duration), startTime: Math.round(entry.startTime) };
            if (entry.duration > 1000) logPageIncident('long-task', data);
            else logDiagnostic('long-task', data);
          })).observe({ type: 'longtask', buffered: true });
        } catch (_) { /* 浏览器不支持 longtask 时使用事件循环哨兵。 */ }
      }
      if (typeof performance !== 'undefined' && typeof setInterval === 'function') {
        let watchdogAt = Date.now();
        setInterval(() => {
          const now = Date.now();
          const delay = now - watchdogAt - 10000;
          watchdogAt = now;
          const data = { delayMs: Math.max(0, delay), visibility: document.visibilityState, online: navigator.onLine,
            iframeSrc: windows[0]?.querySelector('iframe')?.src || null };
          if (delay > 1000) logPageIncident('watchdog-delayed', data);
          logDiagnostic('watchdog', data);
        }, 10000);
      }

      windows.forEach((gameWindow) => {
        const frame = gameWindow.querySelector('iframe');
        frame.addEventListener('load', () => {
          const streamState = streamStates.get(gameWindow);
          streamState.loaded = true;
          streamState.session = null;
          gameWindow.querySelector('.window-state').textContent = '已加载';
          logDiagnostic('iframe-load', { src: frame.src || null });
          sendStreamControl(gameWindow);
          syncDiagnosticsToFrames();
        });
        frame.addEventListener('error', (event) => logPageIncident('iframe-error', { generation: streamStates.get(gameWindow).generation,
          iframeSession: streamStates.get(gameWindow).session, error: event.error || null }));
        loadFrame(gameWindow);
      });
    </script>
  </body>
</html>
