<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>金铲铲自动对战</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #0d1520;
        --surface: #152232;
        --surface-raised: #1b2b3f;
        --border: #31475e;
        --text: #eaf2fb;
        --muted: #91a6bc;
        --accent: #54b6ff;
        --accent-strong: #258bd3;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        background: #111c2a;
      }

      .title-group { min-width: 0; }

      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .subtitle a {
        color: var(--accent);
        text-decoration: none;
      }

      .subtitle a:hover,
      .subtitle a:focus-visible {
        text-decoration: underline;
      }

      button {
        min-height: 34px;
        padding: 7px 12px;
        border: 1px solid #49647e;
        border-radius: 5px;
        background: #22364c;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      main {
        display: flex;
        width: min(1800px, 100%);
        flex: 1;
        margin: 0 auto;
        padding: 18px;
      }

      .window-grid {
        display: grid;
        width: 100%;
        min-height: 0;
        align-items: center;
        justify-items: center;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        gap: 14px;
      }

      .game-window {
        display: flex;
        width: min(100%, 1600px, calc(177.78vh - 266.67px));
        min-width: 0;
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface);
        box-shadow: 0 7px 24px #0000002b;
      }

      .window-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 42px;
        padding: 7px 10px 7px 13px;
        background: var(--surface-raised);
      }

      .window-label {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }

      .window-dot {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px #54b6ff1c;
      }

      .window-state {
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      iframe {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        min-height: 0;
        flex: 0 1 auto;
        border: 0;
        background: #080d14;
      }

      @media (max-width: 760px) {
        .topbar { align-items: flex-start; flex-direction: column; padding: 15px; }
        main { padding: 12px; }
        .window-grid { grid-template-columns: 1fr; grid-template-rows: minmax(360px, 1fr); }
        .game-window { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="title-group">
          <h1>金铲铲自动对战</h1>
          <p class="subtitle">
            <a href="https://www.tampermonkey.net/" target="_blank" rel="noopener noreferrer">Tampermonkey 官网</a>
            <span aria-hidden="true"> · </span>
            <a href="https://jcc.5678989.eu.org/cloud-game-click-automation.user.js" target="_blank" rel="noopener noreferrer">自动化脚本</a>
            <span aria-hidden="true"> · </span>
            <a href="chrome://extensions/" target="_blank" rel="noopener noreferrer">Chrome 扩展管理</a>
            <span aria-hidden="true"> · </span>
            <a href="edge://extensions/" target="_blank" rel="noopener noreferrer">Edge 扩展管理</a>
          </p>
        </div>
      </header>

      <main>
        <section class="window-grid" aria-label="金铲铲自动对战">
          <article class="game-window" data-window="1">
            <div class="window-bar">
              <div class="window-label"><span class="window-dot"></span><span>金铲铲自动对战</span><span class="window-state">加载中...</span></div>
            </div>
            <iframe title="金铲铲自动对战" loading="eager" allow="autoplay; fullscreen; clipboard-read; clipboard-write"></iframe>
          </article>
        </section>
      </main>
    </div>

    <script>
      const GAME_URL = 'https://start.qq.com/game/arm-game/?ADTAG=10000000&extra=eyJob21lIjoiaHR0cHM6Ly9zdGFydC5xcS5jb20vd2ViZ2FtZS9wcmUtcGxheWluZy83MDA5Njc/ZnJvbVBhZ2U9Z2FtZV9kZXRhaWxfcGFnZSZBRFRBRz0xMDAwMDAwMCIsInN0YXJ0VmVyc2lvbiI6IjAuMTAuOTQwLjUwMDYwMDIiLCJ3ZWJjZ19jb21tb24iOjF9#/game/700967?time=1790047923464';
      const windows = [...document.querySelectorAll('.game-window')];
      const NETWORK_CHECK_INTERVAL = 15000;
      const NETWORK_PROBE_TIMEOUT = 8000;
      const LOAD_TIMEOUT = 60000;
      const RECOVERY_DELAY = 1500;
      const MAX_RETRY_DELAY = 60000;

      let isNetworkAvailable = navigator.onLine !== false;
      let offlineSince = isNetworkAvailable ? null : Date.now();
      let recoveryTimer = null;
      let probeInFlight = null;
      let recoveryAttempt = 0;

      function setState(text) {
        windows.forEach((gameWindow) => {
          gameWindow.querySelector('.window-state').textContent = text;
        });
      }

      function createFrameUrl() {
        // 每次重连都添加唯一参数，确保浏览器真正重新创建跨域页面。
        const url = new URL(GAME_URL);
        url.searchParams.set('_reconnect', `${Date.now()}-${Math.random().toString(36).slice(2)}`);
        return url.toString();
      }

      function loadFrame(gameWindow, reason = 'initial') {
        const frame = gameWindow.querySelector('iframe');
        const state = gameWindow.querySelector('.window-state');
        const loadToken = Symbol('frame-load');

        frame.__loadToken = loadToken;
        clearTimeout(frame.__loadTimer);
        state.textContent = reason === 'initial' ? '加载中...' : '正在重新连接...';
        frame.src = createFrameUrl();
        frame.__loadTimer = setTimeout(() => {
          if (frame.__loadToken === loadToken) scheduleRecovery('加载超时');
        }, LOAD_TIMEOUT);
      }

      function scheduleRecovery(reason) {
        if (!isNetworkAvailable || recoveryTimer) return;

        const delay = Math.min(
          RECOVERY_DELAY * Math.max(1, 2 ** recoveryAttempt),
          MAX_RETRY_DELAY,
        );
        recoveryAttempt += 1;
        setState(`${reason}，${Math.ceil(delay / 1000)} 秒后重试...`);
        recoveryTimer = setTimeout(async () => {
          recoveryTimer = null;
          if (!(await probeNetwork())) {
            updateNetworkState(false, 'probe');
            return;
          }
          windows.forEach((gameWindow) => loadFrame(gameWindow, reason));
        }, delay);
      }

      async function probeNetwork() {
        if (probeInFlight) return probeInFlight;

        const probeUrl = `${new URL(GAME_URL).origin}/favicon.ico?_probe=${Date.now()}`;
        probeInFlight = (async () => {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), NETWORK_PROBE_TIMEOUT);
          try {
            await fetch(probeUrl, {
              method: 'GET',
              mode: 'no-cors',
              cache: 'no-store',
              signal: controller.signal,
            });
            return true;
          } catch {
            return false;
          } finally {
            clearTimeout(timeout);
          }
        })();

        try {
          return await probeInFlight;
        } finally {
          probeInFlight = null;
        }
      }

      function updateNetworkState(available, source = 'network') {
        if (!available) {
          if (offlineSince === null) offlineSince = Date.now();
          isNetworkAvailable = false;
          clearTimeout(recoveryTimer);
          recoveryTimer = null;
          setState('网络已断开，等待自动恢复...');
          return;
        }

        const wasOffline = !isNetworkAvailable;
        const outageDuration = offlineSince === null ? 0 : Date.now() - offlineSince;
        isNetworkAvailable = true;
        offlineSince = null;

        // 网络中断过一段时间时，旧 iframe 往往不会自行恢复，恢复后主动重建。
        if (wasOffline && outageDuration >= 3000) {
          scheduleRecovery(`网络已恢复（中断 ${Math.round(outageDuration / 1000)} 秒）`);
        } else if (source === 'probe' && recoveryAttempt > 0) {
          scheduleRecovery('连接不稳定');
        }
      }

      async function checkNetwork() {
        const available = navigator.onLine !== false && await probeNetwork();
        updateNetworkState(available, 'probe');
      }

      windows.forEach((gameWindow) => {
        const frame = gameWindow.querySelector('iframe');
        frame.addEventListener('load', () => {
          clearTimeout(frame.__loadTimer);
          clearTimeout(recoveryTimer);
          recoveryTimer = null;
          recoveryAttempt = 0;
          gameWindow.querySelector('.window-state').textContent = '已加载';
        });
        frame.addEventListener('error', () => scheduleRecovery('页面加载失败'));
        loadFrame(gameWindow);
      });

      window.addEventListener('offline', () => updateNetworkState(false, 'event'));
      window.addEventListener('online', () => checkNetwork());
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) checkNetwork();
      });
      setInterval(checkNetwork, NETWORK_CHECK_INTERVAL);
      checkNetwork();
    </script>
  </body>
</html>
